# Render Blueprint for the free-tier client-demo deploy. Render's free plan
# only supports Web Services (no free Background Workers or Private
# Services), so the backend API + BullMQ worker run combined in one service
# (see backend/package.json's "start:render"), and the cartoonizer — meant to
# be internal-only per specs/04-conventions.md — runs as its own web service
# guarded by a shared secret instead. This is a demo-hosting adaptation, not
# a change to the project's real bare-VPS deploy convention.
services:
  - type: web
    name: toonymous-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production below would otherwise make npm skip
    # devDependencies, which is where typescript/@types/prisma CLI live.
    buildCommand: npm install --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm run start:render
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CARTOONIZER_URL
        sync: false
      - key: CARTOONIZER_SHARED_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: cartoons
      - key: NODE_ENV
        value: production

  - type: web
    name: toonymous-cartoonizer
    runtime: node
    plan: free
    rootDir: cartoonizer
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CARTOONIZER_SHARED_SECRET
        sync: false
      # AnimeGANv2 model, run on CPU in-process (cartoonizer/src/providers/onnx.ts).
      - key: CARTOONIZE_PROVIDER
        value: onnx
      # Skip onnxruntime-node's ~270MB CUDA/TensorRT download at npm install;
      # Render's free plan has no GPU.
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      # Makes glibc hand large freed buffers straight back to the OS. Without
      # it the model's memory peak climbs past 512MB and the instance is
      # OOM-killed mid-image (see cartoonizer/src/providers/onnx.ts).
      - key: MALLOC_MMAP_THRESHOLD_
        value: "1048576"
      - key: NODE_ENV
        value: production
